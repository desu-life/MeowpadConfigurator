[package]
name = "meowpad_configurator"
version = "1.2.1"
description = "A Tauri App"
authors = ["fantasyzhjk", "monodesu"]
license = ""
repository = ""
default-run = "meowpad_configurator"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies.uuid]
version = "1.20"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

[dependencies]
tauri-plugin-single-instance = { version = "2" }
tauri-plugin-store = "2"
tauri-plugin-log = { features = ["colored"] , version = "2" }

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_with = "3"
tauri = { version = "2", features = [] }
hidapi = "2.6"
pretty-hex = "0.4"
once_cell = "1.21"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
toml = "0.9"
meowpadv3 = { path = "./meowpadv3" }
meowpad4k = { path = "./meowpadv2" }
meowpad3k = { path = "./meowpadv2se" }
meowpadv21se = { path = "./meowpadv21se" }
meowpad = { path = "./meowpad" }
meowboard = { path = "./pure64" }
hid-iap = { path = "./hid-iap" }
kagami-studio-iap = { path = "./kagami-studio-iap" }
reqwest = { version = "0.13", features = ["json", "query", "form"] }
regex = "1.12"
thiserror = "2"
better-panic = "0.3"
cfg-if = "1.0"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "0.12"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]


