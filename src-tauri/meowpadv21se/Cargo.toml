[package]
name = "meowpadv21se"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
strum = "0.27"
strum_macros = "0.27"
serde_with = "3"
serde_repr = "0.1"
byteorder = "1.5"
pretty-hex = "0.4"
log = "0.4"
num = "0.4"
num-derive = "0.4"
num-traits = "0.2"
palette = { version = "0.7", features = ["serializing"] }
ciborium = "0.2"
rand = "0.10"
thiserror = "2"
meowpad = { path = "../meowpad" }